<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Annotheca</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="app.css">
  <script type="module" src="js/main.js"></script>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <img src="favicon.svg" alt="" width="32" height="32">
        <div>
          <strong>Annotheca</strong>
          <small data-i18n="app.tagline"></small>
        </div>
      </div>
      <div class="sidebar-heading">
        <span data-i18n="projects"></span>
        <button id="new-project" class="icon-button"
                data-i18n-title="project.new"></button>
      </div>
      <nav id="project-list" class="project-list"></nav>
      <div id="language-switch" class="language-switch"></div>
    </aside>
    <main id="main" class="main"></main>
  </div>
  <div id="viewer" class="viewer" hidden></div>
  <dialog id="dialog" class="dialog"></dialog>
  <div id="toasts" class="toasts" aria-live="polite"></div>
</body>
</html>
