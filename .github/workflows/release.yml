# Publishes to PyPI when a version tag such as v0.2.0 is pushed. PyPI trusts
# this workflow (Trusted Publishing), so no token is stored anywhere.
name: Release

on:
  push:
    tags: ["v*"]

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  publish:
    needs: tests
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Check that the tag matches the version in pyproject.toml
        run: |
          version=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
          test "$GITHUB_REF_NAME" = "v$version"
      - run: pipx run build
      - uses: pypa/gh-action-pypi-publish@release/v1
