[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "annotheca"
version = "0.1.0"
description = "A local, bilingual reference manager for research projects: BibTeX, PDFs, highlights and sticky notes."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Melissa Colin" }]
requires-python = ">=3.10"
keywords = ["bibtex", "bibliography", "research", "pdf", "annotation", "reference-manager"]
classifiers = [
  "Environment :: Web Environment",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "fastapi>=0.110",
  "httpx>=0.27",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
annotheca = "annotheca.cli:main"

[project.urls]
Homepage = "https://github.com/melissa-colin/annotheca"

[tool.pytest.ini_options]
testpaths = ["tests"]
